short_bio: >-
  <p>
    Hi, I'm Lou!
  <p>
    I use mathematics and data to explore questions about people, places, and the events that affect them.
  <p>
    I studied mathematics at the University of the Philippines Diliman, where my undergraduate thesis focused on typhoon impacts. Today, I’m a Junior Research Associate at UP Diliman, working on projects that involve statistical modelling, data collection, and survey analysis.
  <p>
    My work often involves making sense of messy information, that is figuring out how to organise it, what questions it can answer, and how to explain the findings clearly.
  <p>

